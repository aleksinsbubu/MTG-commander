{% extends "base.html" %}

{% block content %}

<div class="page-header">

    <h1 class="page-title">Abilities</h1>

    <a class="btn" href="/abilities/add">
    Add Ability
</a>

</div>

<div class="grid">

{% for ability in abilities %}

<div class="card">

    <h2>{{ ability['name'] }}</h2>

    <p>{{ ability['description'] }}</p>

    <div class="actions">

        <a class="btn"
        href="/abilities/edit/{{ ability['id'] }}">
            Edit
        </a>

        <a class="btn btn-danger"
        href="/abilities/delete/{{ ability['id'] }}">
            Delete
        </a>

    </div>

</div>

{% endfor %}

</div>

{% endblock %}
