{% extends "base.html" %}

{% block content %}

<h1 class="page-title">Delete Card</h1>

<p class="confirm-text">
    Are you sure you want to delete:
    <strong>{{ card['name'] }}</strong>?
</p>

<form method="POST">

    <button class="btn btn-danger">
        Yes, Delete
    </button>

    <a class="btn" href="/card/{{ card['id'] }}">
        Cancel
    </a>

</form>

{% endblock %}
